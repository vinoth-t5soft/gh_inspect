<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Access Graph</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --hover: rgba(11,11,11,0.05);
  --repo: #2a78d6;
  --user: #eb6834;
  --team: #1baf7a;
  --accent: #2a78d6;
  --critical: #d03b3b;
  --shadow: 0 8px 24px rgba(11,11,11,0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --hover: rgba(255,255,255,0.06);
    --repo: #3987e5;
    --user: #d95926;
    --team: #199e70;
    --accent: #3987e5;
    --shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --hover: rgba(255,255,255,0.06);
  --repo: #3987e5;
  --user: #d95926;
  --team: #199e70;
  --accent: #3987e5;
  --shadow: 0 8px 24px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1600px; margin: 0 auto; padding: 20px 16px 40px; }
header h1 { font-size: 20px; margin: 0 0 2px; font-weight: 650; letter-spacing: -0.01em; }
header .meta { color: var(--ink-2); font-size: 13px; }
.notice { margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.notice summary { cursor: pointer; }
.notice ul { margin: 6px 0 0; padding-left: 18px; max-height: 160px; overflow: auto; }

/* Filters */
.filters {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin: 16px 0 12px;
  position: sticky; top: 0; z-index: 20;
  background: var(--page); padding: 8px 0;
}
.search {
  flex: 1 1 220px; max-width: 320px; min-width: 0;
  height: 34px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--ink); font: inherit;
}
.search:focus, .btn:focus-visible, .dd summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dd { position: relative; }
.dd summary, .btn {
  list-style: none; cursor: pointer; user-select: none;
  height: 34px; display: inline-flex; align-items: center; gap: 6px;
  padding: 0 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--ink); font: inherit; white-space: nowrap;
}
.dd summary::-webkit-details-marker { display: none; }
.dd summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-2px); margin-left: 2px; }
.dd summary:hover, .btn:hover { background: var(--hover); }
.dd .k { color: var(--ink-2); }
.dd .v { font-weight: 600; }
.dd.active summary { border-color: var(--accent); }
.dd-menu {
  position: absolute; top: 40px; left: 0; min-width: 240px; max-height: 360px; overflow: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow); padding: 6px; z-index: 30;
}
.dd-menu .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.dd-menu .row:hover { background: var(--hover); }
.dd-menu .row .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.dd-menu .row .hint { color: var(--muted); font-size: 12px; }
.dd-menu .quick { display: flex; gap: 6px; padding: 4px 4px 8px; border-bottom: 1px solid var(--grid); margin-bottom: 4px; }
.dd-menu .quick button { font: inherit; font-size: 12px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 6px 0 12px;
  border-radius: 8px; background: var(--hover); border: 1px solid var(--accent); font-size: 13px;
}
.chip button { border: 0; background: none; color: var(--ink-2); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; }
.spacer { flex: 1 0 0; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.stat .l { color: var(--ink-2); font-size: 12px; }
.stat .n { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }

/* Main */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.graph { position: relative; height: min(72vh, 820px); min-height: 420px; overflow: hidden; }
.graph canvas { display: block; width: 100%; height: 100%; max-width: 100%; cursor: grab; touch-action: none; }
.graph canvas.dragging { cursor: grabbing; }
.graph canvas.over { cursor: pointer; }
.legend {
  position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center;
  background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--ink-2); max-width: calc(100% - 20px);
}
.legend .it { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { display: block; }
.tools { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.tools .btn { height: 30px; padding: 0 10px; font-size: 13px; }
.empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--ink-2); }
.tooltip {
  position: fixed; pointer-events: none; z-index: 50; display: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow);
  padding: 8px 10px; font-size: 12px; max-width: 320px;
}
.tooltip .t { font-weight: 650; font-size: 13px; color: var(--ink); word-break: break-all; }
.tooltip .s { color: var(--ink-2); }
.tooltip .r { display: flex; gap: 10px; justify-content: space-between; }
.tooltip .r b { font-variant-numeric: tabular-nums; color: var(--ink); }

/* Side panel */
.panel { padding: 14px; overflow: auto; height: min(72vh, 820px); min-height: 420px; }
.panel h2 { font-size: 15px; margin: 0 0 4px; word-break: break-all; }
.panel .sub { color: var(--ink-2); font-size: 12px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.panel .tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; color: var(--ink-2); }
.panel .actions { display: flex; gap: 6px; margin: 8px 0 12px; flex-wrap: wrap; }
.panel .actions .btn { height: 30px; font-size: 13px; }
.panel .actions a.btn { text-decoration: none; }
.panel h3 { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; margin: 14px 0 6px; font-weight: 600; }
.conn { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.conn:hover { background: var(--hover); }
.conn .who { font-weight: 550; word-break: break-all; display: flex; align-items: center; gap: 6px; }
.conn .role { font-weight: 600; font-variant-numeric: tabular-nums; }
.conn .via { grid-column: 1 / -1; color: var(--ink-2); font-size: 12px; word-break: break-word; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.panel .placeholder { color: var(--ink-2); }
.panel .placeholder p { margin: 0 0 10px; }

/* Table */
.tablecard { margin-top: 12px; }
.tablehead { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--grid); flex-wrap: wrap; }
.tablehead h2 { font-size: 15px; margin: 0; }
.tablehead .s { color: var(--ink-2); font-size: 13px; }
.tablescroll { overflow: auto; max-height: 520px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 14px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; }
td.mono, td.role { font-variant-numeric: tabular-nums; }
td.role { font-weight: 600; }
tbody tr:hover { background: var(--hover); }

@media (max-width: 980px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .panel { height: auto; min-height: 0; max-height: 60vh; }
  .graph { height: 62vh; min-height: 360px; }
}
@media (max-width: 560px) {
  .search { max-width: none; flex-basis: 100%; }
  .dd-menu { position: fixed; left: 16px; right: 16px; top: auto; min-width: 0; }
  th, td { padding: 6px 10px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GitHub Access Graph</h1>
    <div class="meta" id="meta"></div>
    <div id="notices"></div>
  </header>

  <div class="filters" id="filters">
    <input class="search" id="q" type="search" placeholder="Search users, repos, teams…" autocomplete="off" aria-label="Search">
    <details class="dd" data-key="owners"><summary><span class="k">Owner</span><span class="v">All</span></summary><div class="dd-menu"></div></details>
    <details class="dd" data-key="vis"><summary><span class="k">Visibility</span><span class="v">All</span></summary><div class="dd-menu"></div></details>
    <details class="dd" data-key="roles"><summary><span class="k">Role</span><span class="v">All</span></summary><div class="dd-menu"></div></details>
    <details class="dd" data-key="via"><summary><span class="k">Access via</span><span class="v">All</span></summary><div class="dd-menu"></div></details>
    <details class="dd" data-key="show"><summary><span class="k">Show</span><span class="v"></span></summary><div class="dd-menu"></div></details>
    <span id="isochip"></span>
    <span class="spacer"></span>
    <button class="btn" id="reset" type="button">Reset filters</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="main">
    <div class="card graph" id="graph">
      <canvas id="cv" aria-label="Network graph of repositories, users and teams. Use the table below for an accessible view."></canvas>
      <div class="tools">
        <button class="btn" id="zin" type="button" aria-label="Zoom in">+</button>
        <button class="btn" id="zout" type="button" aria-label="Zoom out">−</button>
        <button class="btn" id="fit" type="button">Fit</button>
        <button class="btn" id="relayout" type="button">Re-layout</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="empty" id="empty">No access matches these filters.</div>
    </div>
    <aside class="card panel" id="panel"></aside>
  </div>

  <section class="card tablecard">
    <div class="tablehead">
      <h2>Access list</h2><span class="s" id="tcount"></span>
      <span class="spacer"></span>
      <button class="btn" id="csv" type="button">Download CSV</button>
    </div>
    <div class="tablescroll">
      <table>
        <thead><tr>
          <th data-sort="repo">Repository</th><th data-sort="principal">Principal</th><th data-sort="ptype">Type</th>
          <th data-sort="role">Role</th><th data-sort="via">Access via</th><th data-sort="vis">Visibility</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</div>
<div class="tooltip" id="tip"></div>

<script id="gh-data" type="application/json">__GH_INSPECT_DATA__</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("gh-data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// ---------- vocabulary ----------
const ROLE_ORDER = ["admin", "maintain", "write", "triage", "read"];
const roleKey = r => ROLE_ORDER.includes(r) ? r : "custom";
const roleRank = r => { const i = ROLE_ORDER.indexOf(r); return i < 0 ? 2.5 : i; };
// Edge weight (screen px) and ink opacity encode role: admin heaviest.
const ROLE_STYLE = { admin: [2.6, 0.80], maintain: [2.1, 0.62], write: [1.6, 0.48], custom: [1.6, 0.48], triage: [1.2, 0.36], read: [0.9, 0.26] };
const VIA_ORDER = ["owner", "direct", "outside-collaborator", "team", "org-owner", "org-base-permission", "team-or-org", "pending-invite"];
const VIA_LABEL = {
  "owner": ["Repo owner", "owner of a personal repo"],
  "direct": ["Direct collaborator", "added to the repo directly"],
  "outside-collaborator": ["Outside collaborator", "not an org member"],
  "team": ["Team", "membership of a team with access"],
  "org-owner": ["Org owner", "implicit admin on every repo"],
  "org-base-permission": ["Org base permission", "default member access"],
  "team-or-org": ["Team or org (unresolved)", "run with --expand-teams"],
  "pending-invite": ["Pending invitation", "invited, not yet accepted"],
};
const viaKey = s => s.startsWith("team:") ? "team" : s;

// ---------- build graph model ----------
const nodes = new Map();
const edges = [];
const owners = new Map(), visCounts = new Map(), roleCounts = new Map(), viaCounts = new Map();
const bump = (m, k) => m.set(k, (m.get(k) || 0) + 1);
let webBase = "https://github.com";

function getNode(id, kind, label, extra) {
  let n = nodes.get(id);
  if (!n) {
    n = { id, kind, label, lower: label.toLowerCase(), x: NaN, y: NaN, vx: 0, vy: 0, fx: null, fy: null, deg: 0, ...extra };
    nodes.set(id, n);
  }
  return n;
}

const repoErrors = [];
for (const r of DATA.repos || []) {
  if (r.url) { try { webBase = new URL(r.url).origin; } catch (_) {} }
  bump(owners, r.owner); bump(visCounts, r.visibility || "unknown");
  const rn = getNode("r:" + r.full_name.toLowerCase(), "repo", r.full_name, { repo: r });
  if (r.errors && r.errors.length) repoErrors.push(r);
  for (const c of r.collaborators || []) {
    const un = getNode("u:" + c.login.toLowerCase(), "user", c.login, { utype: c.type });
    if (c.type) un.utype = c.type;
    const vk = new Set((c.sources || []).map(viaKey));
    if (vk.has("outside-collaborator")) un.outside = true;
    un.hasAccess = true;
    edges.push({ s: un, t: rn, kind: "access", role: c.role, via: c.sources || [], vk, repo: r });
    bump(roleCounts, roleKey(c.role)); vk.forEach(k => bump(viaCounts, k));
  }
  for (const t of r.teams || []) {
    const tn = getNode("t:" + (r.owner + "/" + t.slug).toLowerCase(), "team", r.owner + "/" + t.slug, { org: r.owner, team: t });
    edges.push({ s: tn, t: rn, kind: "team", role: t.role, via: ["team"], vk: new Set(["team"]), repo: r });
    for (const m of t.members || []) {
      const key = "m:" + m.toLowerCase() + "|" + tn.id;
      if (!tn.memberKeys) tn.memberKeys = new Set();
      if (tn.memberKeys.has(key)) continue;
      tn.memberKeys.add(key);
      const un = getNode("u:" + m.toLowerCase(), "user", m, { utype: "User" });
      edges.push({ s: un, t: tn, kind: "member", role: null, via: [], vk: new Set() });
    }
  }
  for (const iv of r.pending_invitations || []) {
    if (!iv.login) continue;
    const un = getNode("u:" + iv.login.toLowerCase(), "user", iv.login, { utype: "User" });
    un.invited = true;
    const via = ["pending-invite" + (iv.invited_by ? " by " + iv.invited_by : "") + (iv.expired ? " (expired)" : "")];
    edges.push({ s: un, t: rn, kind: "invite", role: iv.role, via, vk: new Set(["pending-invite"]), repo: r });
    bump(roleCounts, roleKey(iv.role)); bump(viaCounts, "pending-invite");
  }
}
const hasTeams = edges.some(e => e.kind === "team");
const hasInvites = edges.some(e => e.kind === "invite");
const hasArchived = (DATA.repos || []).some(r => r.archived);
const hasBots = [...nodes.values()].some(n => n.utype === "Bot");

// ---------- header ----------
{
  const parts = [];
  if (DATA.generated_at) parts.push("Generated " + new Date(DATA.generated_at).toLocaleString());
  if (DATA.authenticated_as) parts.push("as " + DATA.authenticated_as);
  const scope = [...(DATA.orgs || []).map(o => "org " + o), ...(DATA.users || []).map(u => "user " + u)];
  if (scope.length) parts.push("scope: " + scope.join(", "));
  $("#meta").textContent = parts.join(" · ");
  const notes = $("#notices");
  const addNote = (title, items) => {
    const d = el("details", "notice"); d.appendChild(el("summary", null, title));
    const ul = el("ul"); items.forEach(t => ul.appendChild(el("li", null, t))); d.appendChild(ul); notes.appendChild(d);
  };
  if (repoErrors.length) addNote(repoErrors.length + " repositor" + (repoErrors.length === 1 ? "y" : "ies") + " could not be fully read",
    repoErrors.map(r => r.full_name + ": " + r.errors.join("; ")));
  if ((DATA.warnings || []).length) addNote(DATA.warnings.length + " warning" + (DATA.warnings.length === 1 ? "" : "s"), DATA.warnings);
}

// ---------- filter state ----------
const ALL = {
  owners: [...owners.keys()].sort((a, b) => a.localeCompare(b)),
  vis: ["public", "internal", "private", "unknown"].filter(v => visCounts.has(v)),
  roles: [...ROLE_ORDER, "custom"].filter(r => roleCounts.has(r)),
  via: VIA_ORDER.filter(v => viaCounts.has(v)),
};
const SHOW_OPTS = [
  ["teams", "Team nodes", hasTeams], ["invites", "Pending invites", hasInvites],
  ["archived", "Archived repos", hasArchived], ["bots", "Bot accounts", hasBots],
  ["labels", "All labels", true],
].filter(o => o[2]);
function defaultState() {
  return {
    q: "", isolate: null,
    owners: new Set(ALL.owners), vis: new Set(ALL.vis), roles: new Set(ALL.roles), via: new Set(ALL.via),
    show: new Set(["teams", "invites", "archived", "bots"]),
  };
}
let F = defaultState();

// ---------- dropdowns ----------
const COUNTS = { owners, vis: visCounts, roles: roleCounts, via: viaCounts };
function ddLabel(key, v) {
  if (key === "via") return VIA_LABEL[v] ? VIA_LABEL[v][0] : v;
  if (key === "show") return (SHOW_OPTS.find(o => o[0] === v) || [, v])[1];
  return v.charAt(0).toUpperCase() + v.slice(1);
}
function buildMenus() {
  document.querySelectorAll(".dd").forEach(dd => {
    const key = dd.dataset.key, menu = $(".dd-menu", dd);
    menu.textContent = "";
    const values = key === "show" ? SHOW_OPTS.map(o => o[0]) : ALL[key];
    if (key !== "show" && values.length > 1) {
      const q = el("div", "quick");
      const a = el("button", null, "Select all"); a.type = "button";
      const n = el("button", null, "Clear"); n.type = "button";
      a.onclick = () => { F[key] = new Set(values); sync(); };
      n.onclick = () => { F[key] = new Set(); sync(); };
      q.append(a, n); menu.appendChild(q);
    }
    for (const v of values) {
      const row = el("label", "row");
      const cb = el("input"); cb.type = "checkbox"; cb.value = v; cb.checked = F[key].has(v);
      cb.onchange = () => { cb.checked ? F[key].add(v) : F[key].delete(v); sync(); };
      const txt = el("span"); txt.appendChild(el("span", null, ddLabel(key, v)));
      if (key === "via" && VIA_LABEL[v]) { txt.appendChild(el("br")); txt.appendChild(el("span", "hint", VIA_LABEL[v][1])); }
      row.append(cb, txt);
      if (COUNTS[key]) row.appendChild(el("span", "n", String(COUNTS[key].get(v) || 0)));
      menu.appendChild(row);
    }
  });
}
function syncMenus() {
  document.querySelectorAll(".dd").forEach(dd => {
    const key = dd.dataset.key;
    const values = key === "show" ? SHOW_OPTS.map(o => o[0]) : ALL[key];
    dd.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = F[key].has(cb.value));
    const sel = values.filter(v => F[key].has(v));
    let txt;
    if (key === "show") txt = sel.length + "/" + values.length;
    else if (sel.length === values.length) txt = "All";
    else if (sel.length === 0) txt = "None";
    else if (sel.length === 1) txt = ddLabel(key, sel[0]);
    else txt = sel.length + " of " + values.length;
    $(".v", dd).textContent = txt;
    dd.classList.toggle("active", key !== "show" && sel.length !== values.length);
  });
  const chip = $("#isochip"); chip.textContent = "";
  if (F.isolate && nodes.get(F.isolate)) {
    const c = el("span", "chip"); c.appendChild(el("span", null, "Focused: " + nodes.get(F.isolate).label));
    const x = el("button", null, "×"); x.type = "button"; x.setAttribute("aria-label", "Clear focus");
    x.onclick = () => { F.isolate = null; sync(); }; c.appendChild(x); chip.appendChild(c);
  }
}
document.addEventListener("click", e => {
  document.querySelectorAll(".dd[open]").forEach(dd => { if (!dd.contains(e.target)) dd.open = false; });
});
document.querySelectorAll(".dd").forEach(dd => dd.addEventListener("toggle", () => {
  if (dd.open) document.querySelectorAll(".dd[open]").forEach(o => { if (o !== dd) o.open = false; });
}));
let qTimer;

  const href = n.kind === "repo" ? (n.repo.url || webBase + "/" + n.label)
    : n.kind === "team" ? webBase + "/orgs/" + n.org + "/teams/" + n.team.slug : webBase + "/" + n.label;
  const a = el("a", "btn", "Open on GitHub ↗"); a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
  actions.appendChild(a);
  p.appendChild(actions);

  if (n.kind === "repo" && n.repo.errors && n.repo.errors.length) {
    p.appendChild(el("h3", null, "Errors"));
    n.repo.errors.forEach(t => p.appendChild(el("div", "via", t)));
  }

  const groups = new Map();
  for (const e of adj.get(n)) {
    const o = e.s === n ? e.t : e.s;
    const g = e.kind === "member" ? (o.kind === "team" ? "Teams" : "Members")
      : e.kind === "invite" ? "Pending invitations" : o.kind === "repo" ? "Repositories" : o.kind === "team" ? "Teams" : "Users";
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push({ e, o });
  }
  const order = ["Users", "Teams", "Members", "Repositories", "Pending invitations"];
  for (const g of order) {
    const list = groups.get(g); if (!list) continue;
    list.sort((a, b) => roleRank(a.e.role || "zz") - roleRank(b.e.role || "zz") || a.o.label.localeCompare(b.o.label));
    p.appendChild(el("h3", null, `${g} (${list.length})`));
    for (const { e, o } of list) {
      const row = el("div", "conn");
      const who = el("span", "who"); const d = el("span", "dot"); d.style.background = `var(--${o.kind})`;
      who.append(d, el("span", null, o.label));
      row.append(who, el("span", "role", e.role || "member"));
      const via = e.kind === "member" ? "team membership" : e.kind === "team" ? "team grant" : e.via.map(prettyVia).join(" · ");
      if (via) row.appendChild(el("span", "via", via));
      row.onclick = () => { selected = o; renderPanel(); needDraw = true; };
      p.appendChild(row);
    }
  }
}
function prettyVia(v) {
  if (v.startsWith("team:")) return "team " + v.slice(5);
  const k = v.split(" ")[0];
  return VIA_LABEL[k] ? VIA_LABEL[k][0] + v.slice(k.length) : v;
}

// ---------- table ----------
let sortKey = "repo", sortDir = 1, tableRows = [];
const TABLE_CAP = 1000;
function rowsFor() {
  const rows = [];
  for (const e of vEdges) {
    if (e.kind === "member") continue;
    rows.push({
      repo: e.repo.full_name, principal: e.s.label,
      ptype: e.kind === "team" ? "Team" : e.kind === "invite" ? "Invitation" : (e.s.utype || "User"),
      role: e.role || "", via: e.kind === "team" ? "team grant" : e.via.map(prettyVia).join("; "),
      vis: e.repo.visibility + (e.repo.archived ? " (archived)" : ""), node: e.s, rnode: e.t,
    });
  }
  return rows;
}
function renderTable() {
  tableRows = rowsFor();
  const cmp = sortKey === "role" ? (a, b) => roleRank(a.role) - roleRank(b.role) : (a, b) => a[sortKey].localeCompare(b[sortKey]);
  tableRows.sort((a, b) => sortDir * cmp(a, b) || a.repo.localeCompare(b.repo) || a.principal.localeCompare(b.principal));
  const tb = $("#tbody"); tb.textContent = "";
  const frag = document.createDocumentFragment();
  for (const r of tableRows.slice(0, TABLE_CAP)) {
    const tr = el("tr");
    tr.append(el("td", null, r.repo), el("td", null, r.principal), el("td", null, r.ptype), el("td", "role", r.role), el("td", null, r.via), el("td", null, r.vis));
    tr.onclick = () => { selected = r.node; renderPanel(); needDraw = true; };
    frag.appendChild(tr);
  }
  tb.appendChild(frag);
  $("#tcount").textContent = tableRows.length > TABLE_CAP
    ? `showing first ${TABLE_CAP.toLocaleString()} of ${tableRows.length.toLocaleString()} rows (CSV has all)`
    : `${tableRows.length.toLocaleString()} rows`;
  document.querySelectorAll("th[data-sort]").forEach(th => {
    th.textContent = th.textContent.replace(/ [▲▼]$/, "") + (th.dataset.sort === sortKey ? (sortDir > 0 ? " ▲" : " ▼") : "");
  });
}
document.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
  const k = th.dataset.sort; sortDir = k === sortKey ? -sortDir : 1; sortKey = k; renderTable();
});
$("#csv").onclick = () => {
  const esc = v => /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const lines = [["repository", "principal", "type", "role", "access_via", "visibility"].join(",")];
  for (const r of tableRows) lines.push([r.repo, r.principal, r.ptype, r.role, r.via, r.vis].map(esc).join(","));
  const blob = new Blob([lines.join("\n") + "\n"], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "github-access.csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ---------- orchestration ----------
function sync() {
  syncMenus();
  const before = new Set(vNodes);
  computeVisible();
  const added = vNodes.filter(n => !before.has(n)).length;
  seedPositions(false);
  if (selected && !adj.has(selected)) selected = null;
  alpha = Math.max(alpha, added > 0 || vNodes.length !== before.size ? 0.6 : 0.1);
  if (added > vNodes.length * 0.3) {
    userMoved = false; ticks = 0;
    settle(250, 0.05); fit(false);
  }
  renderStats(); renderTable(); renderPanel(); renderLegend();
  needDraw = true;
}

readColors();
buildMenus();
resize();
alpha = 1;
sync();
settle(700, 0.02);
fit(false);
requestAnimationFrame(loop);
})();
</script>
